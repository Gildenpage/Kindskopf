<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindsköpfe – Raid & Event Portal</title>
<style>
:root{
  --gold:#d8ad4b;--gold2:#ffe09a;--blue:#3d78a8;--dark:#060b12;
  --panel:#121c27;--panel2:#192735;--border:#35495b;--text:#f0f3f5;
  --muted:#9daab5;--green:#3f9a61;--red:#a94444;
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--text);font-family:Arial,Helvetica,sans-serif;
background:radial-gradient(circle at 50% 0%,#263e52 0,#0c141e 38%,#04070b 85%)}
button{cursor:pointer;font:inherit} .hero{min-height:430px;display:grid;place-items:center;text-align:center;
border-bottom:2px solid var(--gold);position:relative;overflow:hidden;
background:linear-gradient(rgba(2,8,15,.25),rgba(2,7,13,.88)),radial-gradient(ellipse at 50% 35%,rgba(91,154,204,.55),transparent 55%),linear-gradient(135deg,#07101a,#1b3b58,#07101a)}
.hero:after{content:"✦";position:absolute;font-size:420px;opacity:.04;right:5%;top:-90px}
.hero-content{position:relative;z-index:2;padding:25px}.hero-kicker{color:#78b9e8;letter-spacing:4px;font-weight:bold;font-size:14px}
.hero-title{margin:15px 0 0;font:900 clamp(52px,9vw,108px)/1 Georgia,serif;letter-spacing:4px;text-transform:uppercase;text-shadow:0 5px 18px #000}
.hero-line{width:min(600px,80%);height:2px;margin:20px auto;background:linear-gradient(90deg,transparent,var(--gold),var(--gold2),var(--gold),transparent)}
.hero-subtitle{margin:0;color:var(--gold2);font:700 clamp(20px,3vw,34px) Georgia,serif;letter-spacing:4px;text-transform:uppercase}
.hero-description{color:#d4e5f2;letter-spacing:2px}
nav{position:sticky;top:0;z-index:100;display:flex;justify-content:center;flex-wrap:wrap;gap:7px;padding:10px;background:rgba(5,10,16,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
nav button,.btn{border:1px solid #354656;border-radius:5px;padding:10px 15px;color:#eee;background:#17232f;transition:.2s}
nav button:hover,.btn:hover{transform:translateY(-1px)}nav button:hover,.btn-primary{background:var(--gold);color:#111;border-color:var(--gold)}
.btn-secondary{background:#364653;color:#fff}.btn-green{background:var(--green);color:#fff}.btn-danger{background:var(--red);color:#fff}.btn-small{padding:7px 10px;font-size:12px}
main{width:min(1280px,94%);margin:40px auto 80px}section{margin-bottom:70px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.section-title h2{margin:0;color:var(--gold);font:700 28px Georgia,serif}
.news-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.news-card,.raid-card,.event-card,.calendar{background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 15px 45px rgba(0,0,0,.45)}
.news-card{padding:20px;border-left:4px solid var(--gold)}.news-card h3{margin-top:0;color:var(--gold)}.news-date,.muted{color:var(--muted);font-size:13px}
.news-text,.card-description{white-space:pre-wrap;line-height:1.6}
.calendar{overflow:hidden}.calendar-toolbar{display:flex;align-items:center;justify-content:space-between;padding:15px;background:var(--panel2)}
.calendar-toolbar h3{margin:0;color:var(--gold);text-transform:capitalize}.calendar-toolbar button{border:0;border-radius:5px;padding:8px 15px;color:#fff;background:#364653}
.weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr)}.weekdays div{text-align:center;padding:12px 5px;font-weight:bold;color:var(--gold);background:#080e14;border-right:1px solid var(--border)}
.calendar-day{min-height:125px;padding:7px;border-top:1px solid var(--border);border-right:1px solid var(--border)}
.calendar-day.today{box-shadow:inset 0 0 0 2px var(--gold)}.day-number{font-weight:bold;margin-bottom:5px}
.calendar-item{margin-top:5px;padding:6px;border-radius:4px;font-size:10px;line-height:1.3}.calendar-raid{background:#713e3e}.calendar-event{background:#39754d}.calendar-info{background:#39668f}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:20px;background:linear-gradient(135deg,#1a2b3a,#111b25);border-bottom:1px solid var(--border)}
.card-title{color:var(--gold);font:700 25px Georgia,serif}.card-meta{margin-top:7px;color:#aaa;line-height:1.8}.card-body{padding:20px}
.countdown{margin:18px 0;padding:16px;text-align:center;background:linear-gradient(135deg,#252015,#101920);border:1px solid #806229;border-radius:8px}
.countdown-title{color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:2px}.countdown-value{font-size:clamp(20px,4vw,34px);font-weight:bold}.countdown-value span{color:var(--gold2)}.started{color:#ed5d5d}
.role-grid,.requirements,.limit-box{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.requirements,.limit-box{grid-template-columns:repeat(3,1fr)}
.role-box,.requirement,.limit-item{padding:13px;text-align:center;background:#0c141c;border:1px solid var(--border);border-radius:6px}
.role-number,.requirement strong,.limit-item strong{display:block;font-size:25px;margin-bottom:4px}.tank .role-number,.tank strong,.limit-tank strong{color:#e1a45e}.heal .role-number,.heal strong,.limit-heal strong{color:#55d394}.dd .role-number,.dd strong,.limit-dd strong{color:#df6565}.free .role-number{color:#65a8df}
.progress-label{display:flex;justify-content:space-between;margin-bottom:6px;color:#aaa}.progress{height:13px;overflow:hidden;margin-bottom:20px;background:#070a0e;border-radius:20px}.progress-bar{height:100%;background:linear-gradient(90deg,#9a7021,var(--gold2));transition:.3s}
.player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}.player-card{position:relative;padding:13px;background:#10171e;border:1px solid var(--border);border-radius:6px}.player-card strong{display:block;margin-bottom:5px}.player-card small{display:block;margin-top:4px;color:#aaa}.empty-slot{color:#68737e}.remove-player{position:absolute;top:5px;right:5px;border:0;background:none;color:#999;font-size:20px}.remove-player:hover{color:#ff6464}
.modal{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;background:#000c}.modal.active{display:flex}.modal-box{width:min(700px,100%);max-height:93vh;overflow:auto;position:relative;padding:25px;background:#17212b;border:1px solid #56636f;border-top:4px solid var(--gold);border-radius:8px}.modal-box h2{margin-top:0;color:var(--gold);font-family:Georgia,serif}.close-modal{position:absolute;top:6px;right:10px;border:0;background:none;color:#aaa;font-size:28px}.form-group{margin:15px 0}.form-group label{display:block;margin-bottom:6px;color:#bbb}input,select,textarea{width:100%;padding:11px;color:#fff;background:#0a1016;border:1px solid #414d59;border-radius:5px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--gold)}textarea{min-height:100px;resize:vertical}.form-row,.role-limit-form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.role-limit-form{grid-template-columns:repeat(3,1fr)}.modal-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:20px}
.toast{position:fixed;left:50%;bottom:25px;z-index:2000;padding:13px 20px;color:#fff;background:#222c36;border:1px solid var(--gold);border-radius:6px;opacity:0;transform:translate(-50%,30px);pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
.admin-status{position:fixed;right:15px;bottom:15px;z-index:900;display:none;padding:10px 14px;color:#fff;background:#2e783f;border-radius:5px;font-size:13px;font-weight:bold}.admin-status.active{display:block}
footer{padding:45px 20px;text-align:center;color:#777;border-top:1px solid var(--border)}footer strong{color:var(--gold)}
@media(max-width:800px){.section-title,.card-header{flex-direction:column;align-items:flex-start}.role-grid,.requirements,.limit-box,.role-limit-form,.form-row{grid-template-columns:1fr 1fr}.calendar-day{min-height:90px}.calendar-item{font-size:8px;padding:4px}}
@media(max-width:500px){.role-grid,.requirements,.limit-box,.role-limit-form,.form-row{grid-template-columns:1fr}.weekdays div{font-size:10px}.calendar-day{min-height:75px;padding:4px}}
</style>
</head>
<body>
<header class="hero"><div class="hero-content">
<div class="hero-kicker">Allianz · Gilde · Raids · Zusammenhalt</div>
<h1 class="hero-title">Kindsköpfe</h1><div class="hero-line"></div>
<h2 class="hero-subtitle">Raid und Event Portal</h2>
<p class="hero-description">Gemeinsam raiden · gemeinsam erleben · gemeinsam Spaß haben</p>
</div></header>

<nav>
<button onclick="scrollToSection('news')">📰 News</button>
<button onclick="scrollToSection('calendar')">📅 Kalender</button>
<button onclick="scrollToSection('raids')">⚔️ Raidplaner</button>
<button onclick="scrollToSection('events')">🎉 Eventplaner</button>
<button onclick="openAdminLogin()">🔐 Admin</button>
</nav>

<main>
<section id="news"><div class="section-title"><h2>📰 Gilden-News</h2><button class="btn btn-primary" onclick="openNewsForm()">+ News erstellen</button></div><div id="newsContainer" class="news-grid"></div></section>
<section id="calendar"><div class="section-title"><h2>📅 Gildenkalender</h2><button class="btn btn-primary" onclick="openCalendarEntryForm()">+ Kalendereintrag</button></div>
<div class="calendar"><div class="calendar-toolbar"><button onclick="changeMonth(-1)">‹</button><h3 id="calendarTitle"></h3><button onclick="changeMonth(1)">›</button></div>
<div class="weekdays"><div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div></div><div id="calendarGrid" class="calendar-grid"></div></div></section>
<section id="raids"><div class="section-title"><h2>⚔️ Raidplaner</h2><button class="btn btn-primary" onclick="openRaidForm()">+ Raid erstellen</button></div><div id="raidContainer"></div></section>
<section id="events"><div class="section-title"><h2>🎉 Eventplaner</h2><button class="btn btn-primary" onclick="openEventForm()">+ Event erstellen</button></div><div id="eventContainer"></div></section>
</main>

<footer><strong>Kindsköpfe</strong><br><br>Raid und Event Portal</footer>
<div id="adminStatus" class="admin-status">🔐 Admin-Modus aktiv</div><div id="toast" class="toast"></div>
<div id="modal" class="modal"><div class="modal-box"><button class="close-modal" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

/* =========================================================
   KINDKÖPFE – ONLINE VERSION
   Datenbank: Supabase
   ---------------------------------------------------------
   1. SUPABASE_URL eintragen
   2. SUPABASE_PUBLISHABLE_KEY eintragen
   3. SQL-Datei einmal im Supabase SQL Editor ausführen
   4. Admin-Benutzer in Supabase Auth anlegen
   ========================================================= */
const SUPABASE_URL = "https://kdgpqajnvaenwoqkjgfy.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_C7-kN2ej0quDa4IjU9AWkA_lUP8ujuJ";

const wowClasses={
 "Todesritter":[["Blut","Tank"],["Frost","DD"],["Unheilig","DD"]],
 "Druide":[["Gleichgewicht","DD"],["Wildheit","DD"],["Wächter","Tank"],["Wiederherstellung","Heiler"]],
 "Jäger":[["Tierherrschaft","DD"],["Treffsicherheit","DD"],["Überleben","DD"]],
 "Magier":[["Arkan","DD"],["Feuer","DD"],["Frost","DD"]],
 "Mönch":[["Braumeister","Tank"],["Nebelwirker","Heiler"],["Windläufer","DD"]],
 "Paladin":[["Heilig","Heiler"],["Schutz","Tank"],["Vergeltung","DD"]],
 "Priester":[["Disziplin","Heiler"],["Heilig","Heiler"],["Schatten","DD"]],
 "Schurke":[["Meucheln","DD"],["Kampf","DD"],["Täuschung","DD"]],
 "Schamane":[["Elementar","DD"],["Verstärkung","DD"],["Wiederherstellung","Heiler"]],
 "Hexenmeister":[["Gebrechen","DD"],["Dämonologie","DD"],["Zerstörung","DD"]],
 "Krieger":[["Waffen","DD"],["Furor","DD"],["Schutz","Tank"]]
};

let supabaseClient=null;
let news=[],raids=[],events=[],calendarEntries=[];
let isAdmin=false,calendarDate=new Date();

function configured(){return !SUPABASE_URL.startsWith("DEINE_")&&!SUPABASE_PUBLISHABLE_KEY.startsWith("DEIN_");}
function initSupabase(){
 if(!configured()) return false;
 supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
 return true;
}
function escapeHTML(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function formatDate(date){const d=new Date(date+"T12:00:00");return Number.isNaN(d.getTime())?date:d.toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"});}
function getStartDate(item){return new Date(`${item.date}T${item.time||"00:00"}:00`);}
function scrollToSection(id){document.getElementById(id)?.scrollIntoView({behavior:"smooth"});}
function openModal(html){document.getElementById("modalContent").innerHTML=html;document.getElementById("modal").classList.add("active");}
function closeModal(){document.getElementById("modal").classList.remove("active");document.getElementById("modalContent").innerHTML="";}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove("show"),2500);}
function dbError(error){console.error(error);showToast("❌ Datenbankfehler – bitte Konfiguration/RLS prüfen.");}

async function refreshData(){
 if(!supabaseClient)return;
 const [n,r,e,c,s] = await Promise.all([
  supabaseClient.from("news").select("*").order("created_at",{ascending:false}),
  supabaseClient.from("raids").select("*").order("date",{ascending:true}).order("time",{ascending:true}),
  supabaseClient.from("events").select("*").order("date",{ascending:true}).order("time",{ascending:true}),
  supabaseClient.from("calendar_entries").select("*").order("date",{ascending:true}).order("time",{ascending:true}),
  supabaseClient.from("signups").select("*").order("created_at",{ascending:true})
 ]);
 for(const x of [n,r,e,c,s]) if(x.error){dbError(x.error);return;}
 news=n.data||[];raids=r.data||[];events=e.data||[];calendarEntries=c.data||[];
 const signups=s.data||[];
 raids.forEach(x=>x.players=signups.filter(p=>p.item_type==="raid"&&p.item_id===x.id));
 events.forEach(x=>x.players=signups.filter(p=>p.item_type==="event"&&p.item_id===x.id));
 renderAll();
}

async function init(){
 if(!initSupabase()){
  document.getElementById("newsContainer").innerHTML='<div class="news-card"><h3>⚠️ Supabase noch nicht eingerichtet</h3><div class="news-text">Öffne die HTML-Datei und trage oben SUPABASE_URL und SUPABASE_PUBLISHABLE_KEY ein. Danach die SQL-Datei in Supabase ausführen und die Seite neu auf Netlify deployen.</div></div>';
  renderCalendar();return;
 }
 const {data:{session}}=await supabaseClient.auth.getSession();
 await updateAdminState(session);
 await refreshData();
 supabaseClient.auth.onAuthStateChange(async (_event,session)=>{await updateAdminState(session);await refreshData();});
}
async function updateAdminState(session){
 if(!session){isAdmin=false;updateAdminStatus();return;}
 const {data,error}=await supabaseClient.from("admin_users").select("user_id").eq("user_id",session.user.id).maybeSingle();
 isAdmin=!!data&&!error;updateAdminStatus();
}
function updateAdminStatus(){document.getElementById("adminStatus").classList.toggle("active",isAdmin);}

/* ===== ADMIN AUTH ===== */
async function openAdminLogin(){
 if(isAdmin){await supabaseClient.auth.signOut();showToast("🔐 Admin-Modus beendet.");return;}
 openModal(`<h2>🔐 Admin Login</h2>
 <div class="form-group"><label>Admin-E-Mail</label><input id="adminEmail" type="email" autocomplete="username"></div>
 <div class="form-group"><label>Passwort</label><input id="adminPassword" type="password" autocomplete="current-password"></div>
 <p class="muted">Der Admin-Zugang läuft über Supabase Auth. Das Passwort wird nicht in dieser HTML-Datei gespeichert.</p>
 <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Abbrechen</button><button class="btn btn-primary" onclick="loginAdmin()">Einloggen</button></div>`);
}
async function loginAdmin(){
 const email=document.getElementById("adminEmail")?.value.trim(),password=document.getElementById("adminPassword")?.value||"";
 if(!email||!password){alert("Bitte E-Mail und Passwort eingeben.");return;}
 const {error}=await supabaseClient.auth.signInWithPassword({email,password});
 if(error){alert("Login fehlgeschlagen: "+error.message);return;}
 closeModal();showToast("🔐 Admin-Modus aktiviert.");
}

/* ===== NEWS ===== */
function openNewsForm(){
 if(!isAdmin){alert("Nur der Admin kann News erstellen.");return;}
 openModal(`<h2>📰 News erstellen</h2><div class="form-group"><label>Überschrift *</label><input id="newsTitle"></div><div class="form-group"><label>Nachricht *</label><textarea id="newsText"></textarea></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Abbrechen</button><button class="btn btn-primary" onclick="saveNews()">Veröffentlichen</button></div>`);
}
async function saveNews(){
 const title=document.getElementById("newsTitle").value.trim(),text=document.getElementById("newsText").value.trim();if(!title||!text){alert("Bitte alle Felder ausfüllen.");return;}
 const {error}=await supabaseClient.from("news").insert({title,text});if(error){dbError(error);return;}closeModal();await refreshData();showToast("📰 News veröffentlicht.");
}
async function deleteNews(id){if(!isAdmin||!confirm("News wirklich löschen?"))return;const {error}=await supabaseClient.from("news").delete().eq("id",id);if(error){dbError(error);return;}await refreshData();showToast("News gelöscht.");}
function renderNews(){const c=document.getElementById("newsContainer");c.innerHTML="";if(!news.length){c.innerHTML='<div class="news-card">Noch keine News vorhanden.</div>';return;}news.forEach(n=>c.insertAdjacentHTML("beforeend",`<article class="news-card"><h3>${escapeHTML(n.title)}</h3><div class="news-date">${escapeHTML(new Date(n.created_at).toLocaleDateString("de-DE"))}</div><div class="news-text">${escapeHTML(n.text)}</div>${isAdmin?`<br><button class="btn btn-danger btn-small" onclick="deleteNews(${n.id})">🗑️ Löschen</button>`:""}</article>`));}

/* ===== KALENDER ===== */
function openCalendarEntryForm(id=null){
 if(!isAdmin){alert("Nur der Admin kann Kalendereinträge erstellen.");return;}const e=id===null?null:calendarEntries.find(x=>x.id===id);if(id!==null&&!e)return;
 openModal(`<h2>📅 ${e?"Kalendereintrag bearbeiten":"Kalendereintrag erstellen"}</h2><div class="form-group"><label>Titel *</label><input id="calTitle" value="${e?escapeHTML(e.title):""}"></div><div class="form-group"><label>Art</label><select id="calType"><option>Info</option><option>Gildenevent</option><option>Raid</option><option>Geburtstag</option><option>Sonstiges</option></select></div><div class="form-row"><div class="form-group"><label>Datum *</label><input type="date" id="calDate" value="${e?.date||""}"></div><div class="form-group"><label>Uhrzeit</label><input type="time" id="calTime" value="${e?.time||"20:00"}"></div></div><div class="form-group"><label>Beschreibung</label><textarea id="calDescription">${e?escapeHTML(e.description):""}</textarea></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Abbrechen</button><button class="btn btn-primary" onclick="saveCalendarEntry(${id===null?"null":id})">💾 Speichern</button></div>`);
 if(e)document.getElementById("calType").value=e.type;
}
async function saveCalendarEntry(id){
 const payload={title:document.getElementById("calTitle").value.trim(),type:document.getElementById("calType").value,date:document.getElementById("calDate").value,time:document.getElementById("calTime").value,description:document.getElementById("calDescription").value.trim()};if(!payload.title||!payload.date){alert("Titel und Datum sind erforderlich.");return;}
 const q=id===null?supabaseClient.from("calendar_entries").insert(payload):supabaseClient.from("calendar_entries").update(payload).eq("id",id);const {error}=await q;if(error){dbError(error);return;}closeModal();await refreshData();showToast("📅 Kalender aktualisiert.");
}
async function deleteCalendarEntry(id){if(!isAdmin||!confirm("Kalendereintrag löschen?"))return;const {error}=await supabaseClient.from("calendar_entries").delete().eq("id",id);if(error){dbError(error);return;}await refreshData();showToast("Kalendereintrag gelöscht.");}
function changeMonth(n){calendarDate.setMonth(calendarDate.getMonth()+n);renderCalendar();}
function renderCalendar(){
 const y=calendarDate.getFullYear(),m=calendarDate.getMonth();document.getElementById("calendarTitle").textContent=new Date(y,m,1).toLocaleDateString("de-DE",{month:"long",year:"numeric"});const first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),grid=document.getElementById("calendarGrid");grid.innerHTML="";for(let i=0;i<first;i++)grid.insertAdjacentHTML("beforeend",'<div class="calendar-day"></div>');const now=new Date();
 for(let d=1;d<=days;d++){const date=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`,today=now.getFullYear()===y&&now.getMonth()===m&&now.getDate()===d;let h=`<div class="calendar-day ${today?"today":""}"><div class="day-number">${d}</div>`;raids.filter(r=>r.date===date).forEach(r=>h+=`<div class="calendar-item calendar-raid">⚔️ ${escapeHTML(r.time)} · ${escapeHTML(r.name)}</div>`);events.filter(e=>e.date===date).forEach(e=>h+=`<div class="calendar-item calendar-event">🎉 ${escapeHTML(e.time)} · ${escapeHTML(e.name)}</div>`);calendarEntries.filter(e=>e.date===date).forEach(e=>h+=`<div class="calendar-item calendar-info">${escapeHTML(e.type)} · ${escapeHTML(e.time||"")} · ${escapeHTML(e.title)}${isAdmin?`<br><button class="btn btn-secondary btn-small" onclick="openCalendarEntryForm(${e.id})">✏️</button> <button class="btn btn-danger btn-small" onclick="deleteCalendarEntry(${e.id})">🗑️</button>`:""}</div>`);grid.insertAdjacentHTML("beforeend",h+"</div>");}
}

/* ===== RAIDS ===== */
function openRaidForm(id=null){
 if(!isAdmin){alert("Nur der Admin kann Raids erstellen.");return;}const r=id===null?null:raids.find(x=>x.id===id);if(id!==null&&!r)return;
 openModal(`<h2>⚔️ ${r?"Raid bearbeiten":"Raid erstellen"}</h2><div class="form-group"><label>Raidname *</label><input id="raidName" value="${r?escapeHTML(r.name):""}" placeholder="z.B. Mogu'shan Palast"></div><div class="form-group"><label>Raidgröße *</label><select id="raidSize"><option value="10">10 Spieler</option><option value="25">25 Spieler</option></select></div><div class="form-row"><div class="form-group"><label>Datum *</label><input type="date" id="raidDate" value="${r?.date||""}"></div><div class="form-group"><label>Startzeit *</label><input type="time" id="raidTime" value="${r?.time||"20:00"}"></div></div><h3 style="color:var(--gold)">Rollenanforderungen</h3><div class="role-limit-form"><div><label>🛡️ Tanks</label><input type="number" id="raidTankLimit" min="0" max="25" value="${r?.tank_limit??2}"></div><div><label>💚 Heiler</label><input type="number" id="raidHealLimit" min="0" max="25" value="${r?.heal_limit??5}"></div><div><label>⚔️ DDs</label><input type="number" id="raidDDLimit" min="0" max="25" value="${r?.dd_limit??3}"></div></div><p id="raidTotalPreview" class="muted"></p><div class="form-group"><label>Beschreibung</label><textarea id="raidDescription">${r?escapeHTML(r.description):""}</textarea></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Abbrechen</button><button class="btn btn-primary" onclick="saveRaid(${id===null?"null":id})">💾 Raid speichern</button></div>`);document.getElementById("raidSize").value=String(r?.size||10);updateRaidTotal();["raidTankLimit","raidHealLimit","raidDDLimit","raidSize"].forEach(x=>document.getElementById(x).addEventListener("input",updateRaidTotal));
}
function updateRaidTotal(){const a=+document.getElementById("raidTankLimit")?.value||0,b=+document.getElementById("raidHealLimit")?.value||0,c=+document.getElementById("raidDDLimit")?.value||0,s=+document.getElementById("raidSize")?.value||0,p=document.getElementById("raidTotalPreview");if(p)p.innerHTML=a+b+c>s?`<span style="color:#ff6969">⚠️ ${a+b+c}/${s} Rollen – zu viele!</span>`:`Rollen: ${a+b+c}/${s}`;}
async function saveRaid(id){
 const payload={name:document.getElementById("raidName").value.trim(),size:+document.getElementById("raidSize").value,date:document.getElementById("raidDate").value,time:document.getElementById("raidTime").value,tank_limit:+document.getElementById("raidTankLimit").value,heal_limit:+document.getElementById("raidHealLimit").value,dd_limit:+document.getElementById("raidDDLimit").value,description:document.getElementById("raidDescription").value.trim()};if(!payload.name||!payload.date||!payload.time){alert("Raidname, Datum und Startzeit sind erforderlich.");return;}if(payload.tank_limit+payload.heal_limit+payload.dd_limit>payload.size){alert("Die Rollenanforderungen dürfen die Raidgröße nicht überschreiten.");return;}
 if(id!==null){const r=raids.find(x=>x.id===id);if(r&&r.players.length>payload.size){alert("Die Raidgröße kann nicht kleiner als die Teilnehmerzahl sein.");return;}if(r&&r.players.filter(p=>p.role==="Tank").length>payload.tank_limit||r&&r.players.filter(p=>p.role==="Heiler").length>payload.heal_limit||r&&r.players.filter(p=>p.role==="DD").length>payload.dd_limit){alert("Ein Rollenlimit ist kleiner als bereits angemeldete Spieler.");return;}}
 const q=id===null?supabaseClient.from("raids").insert(payload):supabaseClient.from("raids").update(payload).eq("id",id);const {error}=await q;if(error){dbError(error);return;}closeModal();await refreshData();showToast(id===null?"⚔️ Raid erstellt.":"⚔️ Raid aktualisiert.");
}
async function deleteRaid(id){if(!isAdmin)return;const r=raids.find(x=>x.id===id);if(!r||!confirm(`Raid "${r.name}" wirklich löschen?`))return;const {error}=await supabaseClient.from("raids").delete().eq("id",id);if(error){dbError(error);return;}await refreshData();}
async function removeRaidPlayer(rid,pid){if(!isAdmin)return;if(!confirm("Anmeldung wirklich entfernen?"))return;const {error}=await supabaseClient.from("signups").delete().eq("id",pid);if(error){dbError(error);return;}await refreshData();}
function renderCountdown(item){let ms=getStartDate(item)-Date.now();if(ms<=0)return `<div class="countdown"><div class="countdown-title">Status</div><div class="countdown-value started">🔴 STARTZEIT ERREICHT</div></div>`;let s=Math.floor(ms/1000),d=Math.floor(s/86400);s%=86400;let h=Math.floor(s/3600);s%=3600;let min=Math.floor(s/60);s%=60;return `<div class="countdown"><div class="countdown-title">⏳ Beginn in</div><div class="countdown-value"><span>${d}</span> Tage · <span>${String(h).padStart(2,"0")}</span> Stunden · <span>${String(min).padStart(2,"0")}</span> Minuten · <span>${String(s).padStart(2,"0")}</span> Sekunden</div></div>`;}
function renderRaids(){
 const c=document.getElementById("raidContainer");c.innerHTML="";if(!raids.length){c.innerHTML='<div class="raid-card"><div class="card-body muted">Noch keine Raids erstellt.</div></div>';return;}raids.slice().sort((a,b)=>getStartDate(a)-getStartDate(b)).forEach(r=>{r.players=r.players||[];const tanks=r.players.filter(p=>p.role==="Tank").length,heals=r.players.filter(p=>p.role==="Heiler").length,dds=r.players.filter(p=>p.role==="DD").length,free=Math.max(0,r.size-r.players.length),pct=Math.min(100,r.players.length/r.size*100);let ph=r.players.map(p=>`<div class="player-card"><strong>${escapeHTML(p.player)}</strong><small>⚔️ ${escapeHTML(p.character)}</small><small>${escapeHTML(p.class_name)} · ${escapeHTML(p.spec)}</small><small>${escapeHTML(p.role)}</small>${isAdmin?`<button class="remove-player" onclick="removeRaidPlayer(${r.id},${p.id})">×</button>`:""}</div>`).join("");for(let i=r.players.length;i<r.size;i++)ph+='<div class="player-card"><span class="empty-slot">Freier Platz</span></div>';c.insertAdjacentHTML("beforeend",`<article class="raid-card"><div class="card-header"><div><div class="card-title">⚔️ ${escapeHTML(r.name)}</div><div class="card-meta">👥 ${r.size} Spieler<br>📅 ${formatDate(r.date)}<br>🕐 ${escapeHTML(r.time)} Uhr</div></div>${isAdmin?`<div><button class="btn btn-secondary btn-small" onclick="openRaidForm(${r.id})">✏️ Bearbeiten</button> <button class="btn btn-danger btn-small" onclick="deleteRaid(${r.id})">🗑️ Löschen</button></div>`:""}</div><div class="card-body">${renderCountdown(r)}${r.description?`<p class="card-description">${escapeHTML(r.description)}</p>`:""}<div class="requirements"><div class="requirement tank"><strong>${tanks}/${r.tank_limit}</strong>🛡️ Tanks benötigt</div><div class="requirement heal"><strong>${heals}/${r.heal_limit}</strong>💚 Heiler benötigt</div><div class="requirement dd"><strong>${dds}/${r.dd_limit}</strong>⚔️ DDs benötigt</div></div><div class="role-grid"><div class="role-box tank"><span class="role-number">${tanks}</span>🛡️ Tanks</div><div class="role-box heal"><span class="role-number">${heals}</span>💚 Heiler</div><div class="role-box dd"><span class="role-number">${dds}</span>⚔️ DDs</div><div class="role-box free"><span class="role-number">${free}</span>👥 Frei</div></div><div class="progress-label"><span>Teilnehmer</span><span>${r.players.length}/${r.size}</span></div><div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div><div class="player-grid">${ph}</div><br>${free>0?`<button class="btn btn-primary" onclick="openSignup('raid',${r.id})">+ Für Raid anmelden</button>`:'<span class="muted">🔒 Raid ist voll.</span>'}</div></article>`);});}

/* ===== EVENTS ===== */
function openEventForm(id=null){
 if(!isAdmin){alert("Nur der Admin kann Events erstellen.");return;}const e=id===null?null:events.find(x=>x.id===id);if(id!==null&&!e)return;openModal(`<h2>🎉 ${e?"Event bearbeiten":"Event erstellen"}</h2><div class="form-group"><label>Eventname *</label><input id="eventName" value="${e?escapeHTML(e.name):""}"></div><div class="form-group"><label>Art</label><input id="eventType" value="${e?escapeHTML(e.type):"Gildenevent"}"></div><div class="form-row"><div class="form-group"><label>Datum *</label><input type="date" id="eventDate" value="${e?.date||""}"></div><div class="form-group"><label>Startzeit *</label><input type="time" id="eventTime" value="${e?.time||"20:00"}"></div></div><div class="form-group"><label>Maximale Teilnehmer *</label><input type="number" id="eventMax" min="1" max="100" value="${e?.max||10}"></div><div class="role-limit-form"><div><label>🛡️ Tanks</label><input type="number" id="eventTank" min="0" value="${e?.tank_limit??2}"></div><div><label>💚 Heiler</label><input type="number" id="eventHeal" min="0" value="${e?.heal_limit??3}"></div><div><label>⚔️ DDs</label><input type="number" id="eventDD" min="0" value="${e?.dd_limit??5}"></div></div><div class="form-group"><label>Beschreibung</label><textarea id="eventDescription">${e?escapeHTML(e.description):""}</textarea></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Abbrechen</button><button class="btn btn-primary" onclick="saveEvent(${id===null?"null":id})">💾 Event speichern</button></div>`);
}
async function saveEvent(id){
 const payload={name:document.getElementById("eventName").value.trim(),type:document.getElementById("eventType").value.trim()||"Event",date:document.getElementById("eventDate").value,time:document.getElementById("eventTime").value,max:+document.getElementById("eventMax").value,tank_limit:+document.getElementById("eventTank").value,heal_limit:+document.getElementById("eventHeal").value,dd_limit:+document.getElementById("eventDD").value,description:document.getElementById("eventDescription").value.trim()};if(!payload.name||!payload.date||!payload.time||payload.max<1){alert("Bitte Name, Datum, Uhrzeit und Teilnehmerzahl ausfüllen.");return;}if(payload.tank_limit+payload.heal_limit+payload.dd_limit>payload.max){alert("Die Rollenlimits dürfen die maximale Teilnehmerzahl nicht überschreiten.");return;}if(id!==null){const e=events.find(x=>x.id===id);if(e&&e.players.length>payload.max){alert("Maximale Teilnehmerzahl ist kleiner als bereits angemeldete Spieler.");return;}}
 const q=id===null?supabaseClient.from("events").insert(payload):supabaseClient.from("events").update(payload).eq("id",id);const {error}=await q;if(error){dbError(error);return;}closeModal();await refreshData();showToast(id===null?"🎉 Event erstellt.":"🎉 Event aktualisiert.");
}
async function deleteEvent(id){if(!isAdmin)return;const e=events.find(x=>x.id===id);if(!e||!confirm(`Event "${e.name}" wirklich löschen?`))return;const {error}=await supabaseClient.from("events").delete().eq("id",id);if(error){dbError(error);return;}await refreshData();}
async function removeEventPlayer(eid,pid){if(!isAdmin)return;if(!confirm("Anmeldung wirklich entfernen?"))return;const {error}=await supabaseClient.from("signups").delete().eq("id",pid);if(error){dbError(error);return;}await refreshData();}
function renderEvents(){
 const c=document.getElementById("eventContainer");c.innerHTML="";if(!events.length){c.innerHTML='<div class="event-card"><div class="card-body muted">Noch keine Events erstellt.</div></div>';return;}events.slice().sort((a,b)=>getStartDate(a)-getStartDate(b)).forEach(e=>{e.players=e.players||[];const tanks=e.players.filter(p=>p.role==="Tank").length,heals=e.players.filter(p=>p.role==="Heiler").length,dds=e.players.filter(p=>p.role==="DD").length,free=Math.max(0,e.max-e.players.length),pct=Math.min(100,e.players.length/e.max*100);let ph=e.players.map(p=>`<div class="player-card"><strong>${escapeHTML(p.player)}</strong><small>⚔️ ${escapeHTML(p.character)}</small><small>${escapeHTML(p.class_name)} · ${escapeHTML(p.spec)}</small><small>${escapeHTML(p.role)}</small>${isAdmin?`<button class="remove-player" onclick="removeEventPlayer(${e.id},${p.id})">×</button>`:""}</div>`).join("");c.insertAdjacentHTML("beforeend",`<article class="event-card"><div class="card-header"><div><div class="card-title">🎉 ${escapeHTML(e.name)}</div><div class="card-meta">🏷️ ${escapeHTML(e.type)}<br>📅 ${formatDate(e.date)}<br>🕐 ${escapeHTML(e.time)} Uhr</div></div>${isAdmin?`<div><button class="btn btn-secondary btn-small" onclick="openEventForm(${e.id})">✏️ Bearbeiten</button> <button class="btn btn-danger btn-small" onclick="deleteEvent(${e.id})">🗑️ Löschen</button></div>`:""}</div><div class="card-body">${renderCountdown(e)}${e.description?`<p class="card-description">${escapeHTML(e.description)}</p>`:""}<div class="limit-box"><div class="limit-item limit-tank"><strong>${tanks}/${e.tank_limit}</strong>🛡️ Tanks</div><div class="limit-item limit-heal"><strong>${heals}/${e.heal_limit}</strong>💚 Heiler</div><div class="limit-item limit-dd"><strong>${dds}/${e.dd_limit}</strong>⚔️ DDs</div></div><div class="progress-label"><span>Teilnehmer</span><span>${e.players.length}/${e.max}</span></div><div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div><div class="player-grid">${ph}</div><br>${free>0?`<button class="btn btn-primary" onclick="openSignup('event',${e.id})">+ Für Event anmelden</button>`:'<span class="muted">🔒 Event ist voll.</span>'}</div></article>`);});}

/* ===== ANMELDUNG ===== */
function openSignup(type,id){const item=type==="raid"?raids.find(x=>x.id===id):events.find(x=>x.id===id);if(!item)return;const classes=Object.keys(wowClasses).map(c=>`<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`).join("");openModal(`<h2>${type==="raid"?"⚔️ Raid-Anmeldung":"🎉 Event-Anmeldung"}</h2><p class="muted">${escapeHTML(item.name)}</p><div class="form-group"><label>Spielername *</label><input id="signupPlayer" placeholder="Discord-/WoW-Name"></div><div class="form-group"><label>Charaktername *</label><input id="signupCharacter" placeholder="Charakter"></div><div class="form-group"><label>Klasse *</label><select id="signupClass" onchange="updateSpecs()">${classes}</select></div><div class="form-group"><label>Spezialisierung *</label><select id="signupSpec"></select></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Abbrechen</button><button class="btn btn-primary" onclick="saveSignup('${type}',${id})">✅ Anmelden</button></div>`);updateSpecs();}
function updateSpecs(){const c=document.getElementById("signupClass"),s=document.getElementById("signupSpec");if(!c||!s)return;s.innerHTML=wowClasses[c.value].map(([spec,role])=>`<option value="${escapeHTML(spec)}" data-role="${role}">${escapeHTML(spec)} – ${escapeHTML(role)}</option>`).join("");}
async function saveSignup(type,id){
 const player=document.getElementById("signupPlayer").value.trim(),character=document.getElementById("signupCharacter").value.trim(),className=document.getElementById("signupClass").value,specEl=document.getElementById("signupSpec"),spec=specEl.value,role=specEl.selectedOptions[0]?.dataset.role;if(!player||!character){alert("Bitte Spieler- und Charaktername eingeben.");return;}
 const {data,error}=await supabaseClient.rpc("register_signup",{p_item_type:type,p_item_id:id,p_player:player,p_character:character,p_class_name:className,p_spec:spec,p_role:role});if(error){alert("Anmeldung fehlgeschlagen: "+error.message);return;}if(data?.ok===false){alert(data.message||"Anmeldung nicht möglich.");return;}closeModal();await refreshData();showToast(type==="raid"?"⚔️ Erfolgreich für den Raid angemeldet.":"🎉 Erfolgreich für das Event angemeldet.");
}

function renderAll(){renderNews();renderCalendar();renderRaids();renderEvents();updateAdminStatus();}
renderAll();init();setInterval(()=>{renderRaids();renderEvents();},1000);
</script>
