<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kindsköpfe – Raid und Event Portal</title>

<style>

/* =========================================================
   GRUNDLAYOUT
========================================================= */

:root{
    --gold:#d8ad4b;
    --gold-light:#ffe09a;

    --blue:#3d78a8;
    --blue-light:#78b9e8;

    --dark:#060b12;
    --dark2:#0c141e;
    --panel:#121c27;
    --panel2:#192735;
    --panel3:#0b121a;

    --border:#35495b;

    --text:#f0f3f5;
    --muted:#9daab5;

    --green:#3f9a61;
    --red:#a94444;
    --orange:#b87938;

    --shadow:0 15px 45px rgba(0,0,0,.65);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;

    color:var(--text);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 0%,
            #263e52 0,
            #0c141e 38%,
            #04070b 85%
        );
}


/* =========================================================
   HEADER
========================================================= */

.hero{
    position:relative;

    min-height:480px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    border-bottom:2px solid var(--gold);

    background:
        linear-gradient(
            rgba(2,8,15,.30),
            rgba(2,7,13,.82)
        ),
        radial-gradient(
            ellipse at 50% 35%,
            rgba(91,154,204,.55),
            transparent 55%
        ),
        linear-gradient(
            135deg,
            #07101a 0%,
            #1b3b58 48%,
            #07101a 100%
        );
}


/* Berge / Landschaft */

.hero::before{
    content:"";

    position:absolute;
    left:-10%;
    right:-10%;
    bottom:-100px;

    height:270px;

    background:
        linear-gradient(
            135deg,
            transparent 35%,
            #101e2c 36%,
            #101e2c 52%,
            transparent 53%
        ),
        linear-gradient(
            45deg,
            transparent 38%,
            #0a1520 39%,
            #0a1520 62%,
            transparent 63%
        );

    opacity:.95;

    transform:scale(1.15);
}


/* Himmel */

.hero::after{
    content:"";

    position:absolute;

    width:700px;
    height:700px;

    left:50%;
    top:-420px;

    transform:translateX(-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(120,190,240,.45) 0%,
            rgba(65,126,170,.2) 30%,
            transparent 70%
        );

    box-shadow:
        0 0 100px rgba(100,180,240,.15);
}


/* Allianz-inspirierte Banner */

.alliance-banner{
    position:absolute;

    left:7%;
    top:50%;

    width:160px;
    height:260px;

    transform:
        translateY(-50%)
        rotate(-3deg);

    background:
        linear-gradient(
            135deg,
            #173d61,
            #326f9d,
            #102c49
        );

    border:3px solid var(--gold);

    clip-path:
        polygon(
            0 0,
            100% 0,
            100% 82%,
            50% 100%,
            0 82%
        );

    box-shadow:
        0 0 25px #000,
        inset 0 0 35px rgba(255,255,255,.08);

    z-index:2;
}

.alliance-banner::before{
    content:"✦";

    position:absolute;

    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#dcefff;

    font-size:90px;

    text-shadow:
        0 0 15px #9ddcff,
        0 5px 15px #000;
}


/* Rechtes Banner */

.alliance-banner.right{
    left:auto;
    right:7%;

    transform:
        translateY(-50%)
        rotate(3deg);
}


/* Header Inhalt */

.hero-content{
    position:relative;

    z-index:5;

    text-align:center;

    padding:30px 20px;
}


/* kleiner Allianz-Text */

.hero-kicker{
    margin-bottom:18px;

    color:var(--blue-light);

    font-size:14px;
    font-weight:bold;

    letter-spacing:5px;

    text-transform:uppercase;

    text-shadow:
        0 2px 5px #000;
}


/* Haupttitel */

.hero-title{

    margin:0;

    color:#f4f6f7;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(52px,9vw,108px);

    line-height:1;

    font-weight:900;

    letter-spacing:4px;

    text-transform:uppercase;

    text-shadow:
        0 4px 0 #17212c,
        0 7px 18px #000,
        0 0 35px rgba(103,185,240,.35);
}


/* Goldlinie */

.hero-line{

    width:min(600px,80%);

    height:2px;

    margin:22px auto;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--gold),
            var(--gold-light),
            var(--gold),
            transparent
        );

    box-shadow:
        0 0 12px rgba(220,180,70,.5);
}


/* Untertitel */

.hero-subtitle{

    margin:0;

    color:var(--gold-light);

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(20px,3vw,34px);

    font-weight:bold;

    letter-spacing:5px;

    text-transform:uppercase;

    text-shadow:
        0 3px 10px #000;
}


/* Thema */

.hero-description{

    margin-top:20px;

    color:#d4e5f2;

    font-size:15px;

    letter-spacing:2px;
}


/* =========================================================
   NAVIGATION
========================================================= */

nav{

    position:sticky;
    top:0;

    z-index:100;

    display:flex;
    justify-content:center;
    flex-wrap:wrap;

    gap:7px;

    padding:10px;

    background:
        rgba(5,10,16,.94);

    backdrop-filter:blur(10px);

    border-bottom:1px solid var(--border);
}

nav button{

    border:1px solid #354656;

    border-radius:5px;

    padding:11px 17px;

    color:#eee;

    background:#17232f;

    transition:.2s;
}

nav button:hover{

    color:#111;

    background:var(--gold);

    border-color:var(--gold);
}


/* =========================================================
   MAIN
========================================================= */

main{

    width:min(1280px,94%);

    margin:40px auto 80px;
}

section{

    margin-bottom:75px;
}

.section-title{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-bottom:20px;

    padding-bottom:12px;

    border-bottom:1px solid var(--border);
}

.section-title h2{

    margin:0;

    color:var(--gold);

    font-family:Georgia,serif;
}


/* =========================================================
   BUTTONS
========================================================= */

.btn{

    border:0;

    border-radius:5px;

    padding:10px 15px;

    font-weight:bold;

    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn-primary{

    color:#111;

    background:var(--gold);
}

.btn-primary:hover{
    background:var(--gold-light);
}

.btn-secondary{

    color:#fff;

    background:#364653;
}

.btn-green{

    color:white;

    background:var(--green);
}

.btn-danger{

    color:white;

    background:var(--red);
}

.btn-small{

    padding:7px 10px;

    font-size:12px;
}


/* =========================================================
   NEWS
========================================================= */

.news-grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(280px,1fr)
        );

    gap:18px;
}

.news-card{

    padding:20px;

    background:var(--panel);

    border:1px solid var(--border);

    border-left:4px solid var(--gold);

    border-radius:7px;

    box-shadow:var(--shadow);
}

.news-card h3{

    margin-top:0;

    color:var(--gold);
}

.news-date{

    margin-bottom:12px;

    color:var(--muted);

    font-size:13px;
}

.news-text{

    white-space:pre-wrap;

    line-height:1.6;
}


/* =========================================================
   KALENDER
========================================================= */

.calendar{

    overflow:hidden;

    background:var(--panel);

    border:1px solid var(--border);

    border-radius:8px;

    box-shadow:var(--shadow);
}

.calendar-toolbar{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:15px;

    background:var(--panel2);
}

.calendar-toolbar h3{

    margin:0;

    color:var(--gold);

    text-transform:capitalize;
}

.calendar-toolbar button{

    border:0;

    border-radius:5px;

    padding:8px 15px;

    color:white;

    background:#364653;
}

.weekdays,
.calendar-grid{

    display:grid;

    grid-template-columns:
        repeat(7,1fr);
}

.weekdays div{

    padding:12px 5px;

    text-align:center;

    font-weight:bold;

    color:var(--gold);

    background:#080e14;

    border-right:1px solid var(--border);
}

.calendar-day{

    min-height:145px;

    padding:7px;

    border-top:1px solid var(--border);

    border-right:1px solid var(--border);
}

.calendar-day.today{

    box-shadow:
        inset 0 0 0 2px var(--gold);
}

.day-number{

    font-weight:bold;

    margin-bottom:5px;
}

.calendar-item{

    margin-top:5px;

    padding:6px;

    border-radius:4px;

    font-size:10px;

    line-height:1.3;
}

.calendar-raid{
    background:#713e3e;
}

.calendar-event{
    background:#39754d;
}

.calendar-info{
    background:#39668f;
}

.calendar-other{
    background:#695339;
}


/* =========================================================
   CARDS
========================================================= */

.raid-card,
.event-card{

    overflow:hidden;

    margin-bottom:25px;

    background:var(--panel);

    border:1px solid var(--border);

    border-radius:8px;

    box-shadow:var(--shadow);
}

.card-header{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    gap:20px;

    padding:20px;

    background:
        linear-gradient(
            135deg,
            #1a2b3a,
            #111b25
        );

    border-bottom:1px solid var(--border);
}

.card-title{

    color:var(--gold);

    font-family:Georgia,serif;

    font-size:25px;

    font-weight:bold;
}

.card-meta{

    margin-top:7px;

    color:#aaa;

    line-height:1.8;
}

.card-body{

    padding:20px;
}

.card-description{

    white-space:pre-wrap;

    line-height:1.6;
}


/* =========================================================
   COUNTDOWN
========================================================= */

.countdown{

    margin:18px 0;

    padding:18px;

    text-align:center;

    background:
        linear-gradient(
            135deg,
            #252015,
            #101920
        );

    border:1px solid #806229;

    border-radius:8px;
}

.countdown-title{

    margin-bottom:8px;

    color:var(--gold);

    font-size:12px;

    text-transform:uppercase;

    letter-spacing:2px;
}

.countdown-value{

    font-size:
        clamp(22px,4vw,40px);

    font-weight:bold;
}

.countdown-value span{

    color:var(--gold-light);
}

.countdown-started{

    color:#ed5d5d;
}


/* =========================================================
   ROLLEN
========================================================= */

.role-grid{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:10px;

    margin:20px 0;
}

.role-box{

    padding:13px;

    text-align:center;

    background:var(--panel3);

    border:1px solid var(--border);

    border-radius:6px;
}

.role-number{

    display:block;

    margin-bottom:4px;

    font-size:27px;

    font-weight:bold;
}

.role-tank .role-number{
    color:#e1a45e;
}

.role-heal .role-number{
    color:#55d394;
}

.role-dd .role-number{
    color:#df6565;
}

.role-free .role-number{
    color:#65a8df;
}


/* =========================================================
   RAID ROLLENANFORDERUNG
========================================================= */

.raid-requirements{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;

    margin:20px 0;
}

.requirement{

    padding:15px;

    text-align:center;

    background:#0c141c;

    border:1px solid var(--border);

    border-radius:6px;
}

.requirement strong{

    display:block;

    margin-bottom:4px;

    font-size:25px;
}

.requirement.tank strong{
    color:#e1a45e;
}

.requirement.heal strong{
    color:#55d394;
}

.requirement.dd strong{
    color:#df6565;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress-label{

    display:flex;

    justify-content:space-between;

    margin-bottom:6px;

    color:#aaa;
}

.progress{

    height:13px;

    overflow:hidden;

    margin-bottom:20px;

    background:#070a0e;

    border-radius:20px;
}

.progress-bar{

    height:100%;

    background:
        linear-gradient(
            90deg,
            #9a7021,
            var(--gold-light)
        );

    transition:width .3s;
}


/* =========================================================
   SPIELER
========================================================= */

.player-grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(235px,1fr)
        );

    gap:8px;
}

.player-card{

    position:relative;

    padding:13px;

    background:#10171e;

    border:1px solid var(--border);

    border-radius:6px;
}

.player-card strong{

    display:block;

    margin-bottom:5px;
}

.player-card small{

    display:block;

    margin-top:4px;

    color:#aaa;
}

.empty-slot{

    color:#68737e;
}

.remove-player{

    position:absolute;

    top:5px;
    right:5px;

    border:0;

    background:none;

    color:#999;

    font-size:20px;
}

.remove-player:hover{
    color:#ff6464;
}


/* =========================================================
   EVENT ROLLENLIMITS
========================================================= */

.limit-box{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;

    margin:20px 0;
}

.limit-item{

    padding:13px;

    text-align:center;

    background:#0d131a;

    border:1px solid var(--border);

    border-radius:6px;
}

.limit-item strong{

    display:block;

    font-size:23px;
}

.limit-tank strong{
    color:#e1a45e;
}

.limit-heal strong{
    color:#55d394;
}

.limit-dd strong{
    color:#df6565;
}


/* =========================================================
   MODAL
========================================================= */

.modal{

    position:fixed;

    inset:0;

    z-index:1000;

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:#000c;
}

.modal.active{
    display:flex;
}

.modal-box{

    width:min(700px,100%);

    max-height:93vh;

    overflow:auto;

    position:relative;

    padding:25px;

    background:#17212b;

    border:1px solid #56636f;

    border-top:4px solid var(--gold);

    border-radius:8px;
}

.modal-box h2{

    margin-top:0;

    color:var(--gold);

    font-family:Georgia,serif;
}

.close-modal{

    position:absolute;

    top:6px;
    right:10px;

    border:0;

    background:none;

    color:#aaa;

    font-size:28px;
}

.form-group{
    margin:15px 0;
}

.form-group label{

    display:block;

    margin-bottom:6px;

    color:#bbb;
}

input,
select,
textarea{

    width:100%;

    padding:11px;

    color:white;

    background:#0a1016;

    border:1px solid #414d59;

    border-radius:5px;

    outline:none;
}

input:focus,
select:focus,
textarea:focus{

    border-color:var(--gold);
}

textarea{

    min-height:100px;

    resize:vertical;
}

.form-row{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:12px;
}

.role-limit-form{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;
}

.role-limit-form div{

    padding:10px;

    background:#0d131a;

    border:1px solid var(--border);

    border-radius:5px;
}

.role-limit-form label{

    display:block;

    margin-bottom:5px;
}

.modal-actions{

    display:flex;

    justify-content:flex-end;

    flex-wrap:wrap;

    gap:8px;

    margin-top:20px;
}

.muted{

    color:var(--muted);

    font-size:13px;
}


/* =========================================================
   ADMIN
========================================================= */

.admin-status{

    position:fixed;

    right:15px;
    bottom:15px;

    z-index:900;

    display:none;

    padding:10px 14px;

    color:white;

    background:#2e783f;

    border-radius:5px;

    font-size:13px;

    font-weight:bold;
}

.admin-status.active{
    display:block;
}


/* =========================================================
   TOAST
========================================================= */

.toast{

    position:fixed;

    left:50%;
    bottom:25px;

    z-index:2000;

    padding:13px 20px;

    color:white;

    background:#222c36;

    border:1px solid var(--gold);

    border-radius:6px;

    opacity:0;

    transform:
        translateX(-50%)
        translateY(30px);

    pointer-events:none;

    transition:.25s;
}

.toast.show{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================================================
   FOOTER
========================================================= */

footer{

    padding:45px 20px;

    text-align:center;

    color:#777;

    border-top:1px solid var(--border);
}

footer strong{
    color:var(--gold);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

    .alliance-banner{
        display:none;
    }

    .hero{
        min-height:390px;
    }

    .hero-title{
        letter-spacing:2px;
    }

    .hero-subtitle{
        letter-spacing:2px;
    }

    .section-title{
        flex-direction:column;
        align-items:flex-start;
    }

    .card-header{
        flex-direction:column;
    }

    .role-grid{
        grid-template-columns:1fr 1fr;
    }

    .raid-requirements,
    .limit-box,
    .role-limit-form,
    .form-row{
        grid-template-columns:1fr;
    }

    .calendar-day{
        min-height:90px;
    }

    .weekdays div{
        font-size:11px;
    }

    .calendar-item{
        font-size:8px;
        padding:4px;
    }

}

</style>
</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="hero">

    <div class="alliance-banner"></div>

    <div class="alliance-banner right"></div>


    <div class="hero-content">

        <div class="hero-kicker">
            Allianz · Gilde · Raids · Zusammenhalt
        </div>


        <h1 class="hero-title">
            Kindsköpfe
        </h1>


        <div class="hero-line"></div>


        <h2 class="hero-subtitle">
            Raid und Event Portal
        </h2>


        <p class="hero-description">
            Gemeinsam raiden · gemeinsam erleben · gemeinsam Spaß haben
        </p>

    </div>

</header>


<!-- =========================================================
     NAVIGATION
========================================================= -->

<nav>

    <button onclick="scrollToSection('news')">
        📰 News
    </button>

    <button onclick="scrollToSection('calendar')">
        📅 Kalender
    </button>

    <button onclick="scrollToSection('raids')">
        ⚔️ Raidplaner
    </button>

    <button onclick="scrollToSection('events')">
        🎉 Eventplaner
    </button>

    <button onclick="openAdminLogin()">
        🔐 Admin
    </button>

</nav>


<main>


<!-- =========================================================
     NEWS
========================================================= -->

<section id="news">

    <div class="section-title">

        <h2>
            📰 Gilden-News
        </h2>

        <button
            class="btn btn-primary"
            onclick="openNewsForm()">

            + News erstellen

        </button>

    </div>

    <div
        id="newsContainer"
        class="news-grid">
    </div>

</section>


<!-- =========================================================
     KALENDER
========================================================= -->

<section id="calendar">

    <div class="section-title">

        <h2>
            📅 Gildenkalender
        </h2>

        <button
            class="btn btn-primary"
            onclick="openCalendarEntryForm()">

            + Kalendereintrag

        </button>

    </div>


    <div class="calendar">

        <div class="calendar-toolbar">

            <button onclick="changeMonth(-1)">
                ‹
            </button>

            <h3 id="calendarTitle"></h3>

            <button onclick="changeMonth(1)">
                ›
            </button>

        </div>


        <div class="weekdays">

            <div>Mo</div>
            <div>Di</div>
            <div>Mi</div>
            <div>Do</div>
            <div>Fr</div>
            <div>Sa</div>
            <div>So</div>

        </div>


        <div
            id="calendarGrid"
            class="calendar-grid">
        </div>

    </div>

</section>


<!-- =========================================================
     RAIDPLANER
========================================================= -->

<section id="raids">

    <div class="section-title">

        <h2>
            ⚔️ Raidplaner
        </h2>

        <button
            class="btn btn-primary"
            onclick="openRaidForm()">

            + Raid erstellen

        </button>

    </div>

    <div id="raidContainer"></div>

</section>


<!-- =========================================================
     EVENTPLANER
========================================================= -->

<section id="events">

    <div class="section-title">

        <h2>
            🎉 Eventplaner
        </h2>

        <button
            class="btn btn-primary"
            onclick="openEventForm()">

            + Event erstellen

        </button>

    </div>

    <div id="eventContainer"></div>

</section>

</main>


<footer>

    <strong>Kindsköpfe</strong>

    <br><br>

    Raid und Event Portal

</footer>


<div
    id="adminStatus"
    class="admin-status">

    🔐 Admin-Modus aktiv

</div>


<div
    id="toast"
    class="toast">
</div>


<!-- =========================================================
     MODAL
========================================================= -->

/* =========================================================

========================================================= */

function escapeHTML(value){

    return String(value??"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function formatDate(date){

    return new Date(
        `${date}T12:00:00`
    ).toLocaleDateString(
        "de-DE",
        {
            weekday:"long",
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    );

}


function scrollToSection(id){

        .getElementById(id)

        });

}


function openModal(html){

            "modalContent"
        )
        .innerHTML=html;

    document
        .getElementById(
            "modal"
        )
        .classList.add("active");

}


function closeModal(){

    document
        .getElementById(
            "modal"
        )
        .classList.remove("active");

}


function showToast(message){

    const toast=
        document.getElementById(
            "toast"
        );

    toast.textContent=
        message;

    toast.classList.add(
        "show"
    );

    setTimeout(
        ()=>{
            toast.classList.remove(
                "show"
            );
        },
        2500
    );

}

function saveCalendarEntry(id){

        document.getElementById(
            "calDescription"

    if(id===null){

        calendarEntries.push({

            id:Date.now(),

            title,

            date,
            time,
            description

    }else{

        const entry=
            calendarEntries.find(

function changeMonth(amount){

    calendarDate.setMonth(
        calendarDate.getMonth()+amount
    );

    renderCalendar();

}


function renderCalendar(){

    const year=
        calendarDate.getFullYear();

    const month=
        calendarDate.getMonth();


    document.getElementById(
        "calendarTitle"
    ).textContent=
        new Date(
            year,
            month,
            1
        ).toLocaleDateString(
            "de-DE",
            {
                month:"long",
                year:"numeric"
            }
        );


    const firstDay=
        new Date(
            year,
            month,
            1
        ).getDay();


    const offset=
        firstDay===0
        ?6
        :firstDay-1;


    const days=
        new Date(
            year,
            month+1,
            0
        ).getDate();


    const grid=
        document.getElementById(
            "calendarGrid"
        );

    grid.innerHTML="";


    for(
        let i=0;
        i<offset;
        i++
    ){

        grid.innerHTML+=`
            <div class="calendar-day"></div>
        `;

    }


    const now=
        new Date();


    for(
        let day=1;
        day<=days;
        day++
    ){

        const date=
            `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;


        const today=
            now.getFullYear()===year &&
            now.getMonth()===month &&
            now.getDate()===day;


        let html=`

            <div
                class="calendar-day ${today?"today":""}">

                <div class="day-number">
                    ${day}
                </div>

        `;


        raids
            .filter(
                r=>r.date===date
            )
            .forEach(
                raid=>{

                    html+=`

                        <div
                            class="calendar-item calendar-raid">

                            ⚔️
                            ${escapeHTML(raid.time)}
                            ·
                            ${escapeHTML(raid.name)}

                        </div>

                    `;

                }
            );


        events
            .filter(
                e=>e.date===date
            )
            .forEach(
                event=>{

                    html+=`

                        <div
                            class="calendar-item calendar-event">

                            🎉
                            ${escapeHTML(event.time)}
                            ·
                            ${escapeHTML(event.name)}

                        </div>

                    `;

                }
            );


        calendarEntries
            .filter(
                e=>e.date===date
            )
            .forEach(
                entry=>{

                    html+=`

                        <div
                            class="calendar-item calendar-info">

                            ${escapeHTML(entry.type)}
                            ·
                            ${escapeHTML(entry.time||"")}
                            ·
                            ${escapeHTML(entry.title)}

                            ${
                                isAdmin
                                ?
                                `
                                <br><br>

                                <button
                                    class="btn btn-secondary btn-small"
                                    onclick="openCalendarEntryForm(${entry.id})">

                                    ✏️

                                </button>

                                <button
                                    class="btn btn-danger btn-small"
                                    onclick="deleteCalendarEntry(${entry.id})">

                                    🗑️

                                </button>
                                `
                                :""
                            }

                        </div>

                    `;

                }
            );


        html+=`
            </div>
        `;

        grid.innerHTML+=html;

    }

}

function updateRaidTotal(){

    const tank=
        Number(
            document.getElementById(
                "raidTankLimit"
            )?.value||0
        );

    const heal=
        Number(
            document.getElementById(
                "raidHealLimit"
            )?.value||0
        );

    const dd=
        Number(
            document.getElementById(
                "raidDDLimit"
            )?.value||0
        );

    const size=
        Number(
            document.getElementById(
                "raidSize"
            )?.value||0
        );


    const total=
        tank+
        heal+
        dd;


    const preview=
        document.getElementById(
            "raidTotalPreview"
        );


    if(!preview)return;


    if(total>size){

        preview.innerHTML=
            `
            <span style="color:#ff6969">
                ⚠️ ${total}/${size} Rollen eingetragen.
                Die Rollenanforderungen dürfen die Raidgröße
                nicht überschreiten.
            </span>
            `;

    }else{

        preview.innerHTML=
            `
            👥
            Rollenplätze:
            ${total}/${size}
            ·
            ${size-total}
            zusätzliche Plätze
            `;

    }

}


function saveRaid(id){

    const name=
        document.getElementById(
            "raidName"
        ).value.trim();

    const size=
        Number(
            document.getElementById(
                "raidSize"
            ).value
        );

    const date=
        document.getElementById(
            "raidDate"
        ).value;

    const time=
        document.getElementById(
            "raidTime"
        ).value;

    const tankLimit=
        Number(
            document.getElementById(
                "raidTankLimit"
            ).value
        );

    const healLimit=
        Number(
            document.getElementById(
                "raidHealLimit"
            ).value
        );

    const ddLimit=
        Number(
            document.getElementById(
                "raidDDLimit"
            ).value
        );

    const description=
        document.getElementById(
            "raidDescription"
        ).value.trim();


    if(
        !name||
        !date||
        !time
    ){

        alert(
            "Bitte Name, Datum und Uhrzeit ausfüllen."
        );

        return;

    }


    if(
        tankLimit<1||
        tankLimit>10||
        healLimit<1||
        healLimit>10||
        ddLimit<1||
        ddLimit>20
    ){

        alert(
            "Tanks: 1–10, Heiler: 1–10, DDs: 1–20."
        );

        return;

    }


    const required=
        tankLimit+
        healLimit+
        ddLimit;


    if(required>size){

        alert(
            `Die Rollenanforderungen (${required}) `
            +
            `dürfen nicht größer als die Raidgröße (${size}) sein.`
        );

        return;

    }


    if(id===null){

        raids.push({

            id:Date.now(),

            name,
            size,
            date,
            time,

            tankLimit,
            healLimit,
            ddLimit,

            description,

            players:[]

        });

    }else{

        const raid=
            raids.find(
                r=>r.id===id
            );

        if(!raid)return;


        /*
         * Bestehende Rollen prüfen
         */

        const tanks=
            raid.players.filter(
                p=>p.role==="Tank"
            ).length;

        const healers=
            raid.players.filter(
                p=>p.role==="Heiler"
            ).length;

        const dds=
            raid.players.filter(
                p=>p.role==="DD"
            ).length;


        if(
            tanks>tankLimit||
            healers>healLimit||
            dds>ddLimit
        ){

            alert(
                "Die neuen Rollenlimits sind kleiner als bereits angemeldete Spieler."
            );

            return;

        }


        if(
            raid.players.length>size
        ){

            alert(
                "Die Raidgröße kann nicht kleiner als die Teilnehmerzahl sein."
            );

            return;

        }


        raid.name=name;
        raid.size=size;
        raid.date=date;
        raid.time=time;

        raid.tankLimit=tankLimit;
        raid.healLimit=healLimit;
        raid.ddLimit=ddLimit;

    showToast(
        id===null

function saveSignup(
    type,
    id
){

    const player=
        document.getElementById(
            "signupPlayer"
        ).value.trim();

    const character=
        document.getElementById(
            "signupCharacter"
        ).value.trim();

    const className=
        document.getElementById(
            "signupClass"
        ).value;

    const specElement=
        document.getElementById(
            "signupSpec"
        );

    const spec=
        specElement.value;

    const role=
        specElement
        .selectedOptions[0]
        .dataset.role;


    if(
        !player||
        !character
    ){

        alert(
            "Bitte Spieler- und Charaktername eingeben."
        );

        return;

    }


    if(type==="raid"){

        const raid=
            raids.find(
                r=>r.id===id
            );

        if(!raid)return;


        if(
            raid.players.length>=
            raid.size
        ){

            alert(
                "Der Raid ist voll."
            );

            return;

        }


        /*
         * Prüfen, ob Rolle voll ist
         */

        const currentRoleCount=
            raid.players.filter(
                p=>p.role===role
            ).length;


        const roleLimit=
            role==="Tank"
            ?
            raid.tankLimit
            :
            role==="Heiler"
            ?
            raid.healLimit
            :
            raid.ddLimit;


        if(
            currentRoleCount>=roleLimit
        ){

            alert(
                `Für ${role} sind bereits alle Plätze belegt.`
            );

            return;

        }


        if(
            raid.players.some(
                p=>
                    p.player.toLowerCase()===
                    player.toLowerCase()
            )
        ){

            alert(
                "Dieser Spieler ist bereits angemeldet."
            );

            return;

        }


        raid.players.push({

            id:Date.now(),

            player,
            character,
            className,
            spec,
            role

        });


        saveData();

        closeModal();

        renderAll();

        showToast(
            "⚔️ Erfolgreich für den Raid angemeldet."
        );


    }else{

        const event=
            events.find(
                e=>e.id===id
            );

        if(!event)return;


        if(
            event.players.length>=
            event.max
        ){

            alert(
                "Das Event ist voll."
            );

            return;

        }


        const roleCount=
            event.players.filter(
                p=>p.role===role
            ).length;


        const roleLimit=
            role==="Tank"
            ?
            event.tankLimit
            :
            role==="Heiler"
            ?
            event.healLimit
            :
            event.ddLimit;


        if(
            roleCount>=roleLimit
        ){

            alert(
                `Für ${role} sind bereits alle Plätze belegt.`
            );

            return;

        }


        if(
            event.players.some(
                p=>
                    p.player.toLowerCase()===
                    player.toLowerCase()
            )
        ){

            alert(
                "Dieser Spieler ist bereits angemeldet."
            );

            return;

        }


        event.players.push({

            id:Date.now(),

            player,
            character,
            className,
            spec,
            role

        });


        saveData();

        closeModal();

        renderAll();

        showToast(
            "🎉 Erfolgreich für das Event angemeldet."
        );

    }

}


/* =========================================================
   COUNTDOWN
========================================================= */

function getStartDate(item){

    return new Date(
        `${item.date}T${item.time||"00:00"}:00`
    );

}


function renderCountdown(item){

    const target=
        getStartDate(item);

    let difference=
        target.getTime()-
        Date.now();


    if(difference<=0){

        return`

            <div class="countdown">

                <div class="countdown-title">
                    Status
                </div>

                <div class="countdown-value countdown-started">
                    🔴 STARTZEIT ERREICHT
                </div>

            </div>

        `;

    }


    let seconds=
        Math.floor(
            difference/1000
        );


    const days=
        Math.floor(
            seconds/86400
        );

    seconds%=86400;


    const hours=
        Math.floor(
            seconds/3600
        );

    seconds%=3600;


    const minutes=
        Math.floor(
            seconds/60
        );

    seconds%=60;


    return`

        <div class="countdown">

            <div class="countdown-title">
                ⏳ Beginn in
            </div>

            <div class="countdown-value">

                <span>${days}</span> Tage ·

                <span>
                    ${String(hours).padStart(2,"0")}
                </span> Stunden ·

                <span>
                    ${String(minutes).padStart(2,"0")}
                </span> Minuten ·

                <span>
                    ${String(seconds).padStart(2,"0")}
                </span> Sekunden

            </div>

        </div>

    `;

}

function removeRaidPlayer(
    raidId,
    playerId
){

    if(!isAdmin)return;


    const raid=
        raids.find(
            r=>r.id===raidId
        );

    if(!raid)return;


    const player=
        raid.players.find(
            p=>p.id===playerId
        );

    if(!player)return;


    if(
        !confirm(
            `Anmeldung von ${player.player} entfernen?`
        )
    )return;


    raid.players=
        raid.players.filter(
            p=>p.id!==playerId
        );


    saveData();

    renderAll();

    showToast(
        "Raid-Anmeldung entfernt."
    );

}


function deleteRaid(id){

    if(!isAdmin)return;


    const raid=
        raids.find(
            r=>r.id===id
        );


    if(
        !raid||
        !confirm(
            `Raid "${raid.name}" wirklich löschen?`
        )
    )return;


    raids=
        raids.filter(
            r=>r.id!==id
        );


    saveData();

    renderAll();

}

function saveEvent(id){

    const name=
        document.getElementById(
            "eventName"
        ).value.trim();

    const type=
        document.getElementById(
            "eventType"
        ).value;

    const date=
        document.getElementById(
            "eventDate"
        ).value;

    const time=
        document.getElementById(
            "eventTime"
        ).value;

    const tankLimit=
        Number(
            document.getElementById(
                "eventTankLimit"
            ).value
        );

    const healLimit=
        Number(
            document.getElementById(
                "eventHealLimit"
            ).value
        );

    const ddLimit=
        Number(
            document.getElementById(
                "eventDDLimit"
            ).value
        );

    const description=
        document.getElementById(
            "eventDescription"
        ).value.trim();


    if(
        !name||
        !date||
        !time
    ){

        alert(
            "Bitte Name, Datum und Uhrzeit ausfüllen."
        );

        return;

    }


    const max=
        tankLimit+
        healLimit+
        ddLimit;


    if(
        tankLimit<1||
        tankLimit>10||
        healLimit<1||
        healLimit>10||
        ddLimit<1||
        ddLimit>20
    ){

        alert(
            "Tanks 1–10, Heiler 1–10, DDs 1–20."
        );

        return;

    }


    if(id===null){

        events.push({

            id:Date.now(),

            name,
            type,
            date,
            time,

            tankLimit,
            healLimit,
            ddLimit,

            max,

            description,

            players:[]

        });

    }else{

        const event=
            events.find(
                e=>e.id===id
            );

        if(!event)return;


        const tanks=
            event.players.filter(
                p=>p.role==="Tank"
            ).length;

        const healers=
            event.players.filter(
                p=>p.role==="Heiler"
            ).length;

        const dds=
            event.players.filter(
                p=>p.role==="DD"
            ).length;


        if(
            tanks>tankLimit||
            healers>healLimit||
            dds>ddLimit
        ){

            alert(
                "Die neuen Rollenlimits sind kleiner als bestehende Anmeldungen."
            );

            return;

        }


        event.name=name;
        event.type=type;
        event.date=date;
        event.time=time;

        event.tankLimit=tankLimit;
        event.healLimit=healLimit;
        event.ddLimit=ddLimit;

        event.max=max;

        event.description=description;

    }


    saveData();

    closeModal();

    renderAll();

    showToast(
        id===null
        ?
        "🎉 Event erstellt."
        :
        "🎉 Event aktualisiert."
    );

}

                                <div class="card-meta">

                                    🏷️
                                    ${escapeHTML(event.type)}

                                    <br>

                                    📅
                                    ${formatDate(event.date)}

                                    <br>

                                    🕐
                                    ${escapeHTML(event.time)} Uhr

                                </div>

                            </div>


                            ${
                                isAdmin
                                ?
                                `
                                <div>

                                    <button
                                        class="btn btn-secondary btn-small"
                                        onclick="openEventForm(${event.id})">

                                        ✏️ Bearbeiten

                                    </button>

                                    <button
                                        class="btn btn-danger btn-small"
                                        onclick="deleteEvent(${event.id})">

                                        🗑️ Löschen

                                    </button>

                                </div>
                                :""
                            }

                        </div>


                        <div class="card-body">

                            ${renderCountdown(event)}


                            ${
                                event.description
                                ?
                                `
                                <p class="card-description">
                                    ${escapeHTML(event.description)}
                                </p>
                                `
                                :""
                            }


                            <div class="limit-box">

                                <div class="limit-item limit-tank">

                                    <strong>
                                        ${tanks}/${event.tankLimit}
                                    </strong>

                                    🛡️ Tanks

                                </div>


                                <div class="limit-item limit-heal">

                                    <strong>
                                        ${healers}/${event.healLimit}
                                    </strong>

                                    💚 Heiler

                                </div>


                                <div class="limit-item limit-dd">

                                    <strong>
                                        ${dds}/${event.ddLimit}
                                    </strong>

                                    ⚔️ DDs

                                </div>

                            </div>


                            <div class="progress-label">

                                <span>
                                    Teilnehmer
                                </span>

                                <span>
                                    ${event.players.length}/${event.max}
                                </span>

                            </div>


                            <div class="progress">

                                <div
                                    class="progress-bar"
                                    style="width:${percent}%">

                                </div>

                            </div>


                            <div class="player-grid">

                                ${playersHTML}

                            </div>


                            <br>


                            ${
                                free>0
                                ?
                                `
                                <button
                                    class="btn btn-primary"
                                    onclick="openEventSignup(${event.id})">

                                    + Für Event anmelden

                                </button>
                                `
                                :
                                `
                                <span class="muted">
                                    🔒 Event ist voll.
                                </span>
                                `
                            }

                        </div>

                    </article>

                `;

            }
        );

}


function removeEventPlayer(
    eventId,
    playerId
){

    if(!isAdmin)return;


    const event=
        events.find(
            e=>e.id===eventId
        );

    if(!event)return;


    const player=
        event.players.find(
            p=>p.id===playerId
        );

    if(!player)return;


    if(
        !confirm(
            `Anmeldung von ${player.player} entfernen?`
        )
    )return;


    event.players=
        event.players.filter(
            p=>p.id!==playerId
        );


    saveData();

    renderAll();

    showToast(
        "Event-Anmeldung entfernt."
    );

}


function deleteEvent(id){

    if(!isAdmin)return;


    const event=
        events.find(
            e=>e.id===id
        );


    if(
        !event||
        !confirm(
            `Event "${event.name}" wirklich löschen?`
        )
    )return;


    events=
        events.filter(
            e=>e.id!==id
        );


    saveData();

    renderAll();

}


/* =========================================================
   MODAL
========================================================= */

document
    .getElementById("modal")
    .addEventListener(
        "click",
        function(e){

            if(e.target===this){
                closeModal();
            }

        }
    );


/* =========================================================
   ALLES RENDERN
========================================================= */

function renderAll(){

    renderNews();

    renderCalendar();

    renderRaids();

    renderEvents();

    updateAdminStatus();

}


renderAll();


/*
 * Countdown jede Sekunde aktualisieren.
 */

setInterval(
    ()=>{
        renderRaids();
        renderEvents();
    },
    1000
);

</script>
